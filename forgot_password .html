<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Book-face — Esqueci Senha</title>
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="layout.css" />
  <style>
    body{font-family:Inter,system-ui,Arial,Helvetica,sans-serif;background:#f3f6fb;margin:0;color:#0f172a}
    .topbar{background:#fff;box-shadow:0 2px 8px rgba(2,6,23,0.04);position:sticky;top:0}
    .topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
    .container{max-width:720px;margin:18px auto;padding:12px}
    .card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 6px 18px rgba(2,6,23,0.04)}
    .field{display:flex;flex-direction:column;margin-bottom:12px}
    .field input{padding:10px;border-radius:8px;border:1px solid #e6eef6}
    .muted{color:#6b7280}
    .actions{display:flex;gap:8px}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div><a href="settings.html" class="link">Voltar</a></div>
      <div style="font-weight:700">Esqueci Senha</div>
      <div></div>
    </div>
  </header>

  <main class="container">
    <section class="card" id="step1">
      <h3>Recuperar senha</h3>
      <p class="muted">Insere o email da conta. Vais receber um código de 4 dígitos (simulado localmente) para confirmar a alteração.</p>

      <div class="field">
        <label>Email</label>
        <input id="emailInput" type="email" placeholder="teu@email.com">
      </div>

      <div class="actions">
        <button id="sendCode" class="btn small">Enviar código</button>
      </div>

      <div id="msg1" style="margin-top:12px"></div>
    </section>

    <section class="card" id="step2" style="display:none">
      <h3>Confirmar código</h3>
      <p class="muted">Insere o código de 4 dígitos que recebeste e define a nova senha.</p>

      <div class="field">
        <label>Código (4 dígitos)</label>
        <input id="codeInput" type="text" maxlength="4" placeholder="1234">
      </div>

      <div class="field">
        <label>Nova senha</label>
        <input id="newPass" type="password" placeholder="Nova senha">
      </div>

      <div class="field">
        <label>Confirmar nova senha</label>
        <input id="confirmPass" type="password" placeholder="Confirmar nova senha">
      </div>

      <div class="actions">
        <button id="confirmBtn" class="btn small">Confirmar</button>
      </div>

      <div id="msg2" style="margin-top:12px"></div>
    </section>
  </main>

  <script>
  (function(){
    // Storage key para códigos temporários
    const CODES_KEY = 'bf_reset_codes'; // array de { email, code, expiresAt }

    function readCodes(){ return JSON.parse(localStorage.getItem(CODES_KEY) || '[]'); }
    function writeCodes(c){ localStorage.setItem(CODES_KEY, JSON.stringify(c)); }

    function generateCode(){ return String(Math.floor(1000 + Math.random()*9000)); }

    document.getElementById('sendCode').addEventListener('click', ()=> {
      const email = (document.getElementById('emailInput').value || '').trim().toLowerCase();
      const msg = document.getElementById('msg1'); msg.textContent = '';
      if (!email) { msg.textContent = 'Escreve o email da conta.'; return; }
      const users = DB.getUsers();
      const user = users.find(u => (u.email||'').toLowerCase() === email);
      if (!user) { msg.textContent = 'Email não encontrado.'; return; }
      const code = generateCode();
      const expiresAt = new Date(Date.now() + 15*60*1000).toISOString(); // 15 minutos
      const codes = readCodes();
      // remove códigos antigos para este email
      const filtered = codes.filter(c => c.email !== email);
      filtered.push({ email, code, expiresAt });
      writeCodes(filtered);
      // Simulação: mostramos o código na UI (em produção enviar por email/SMS)
      msg.innerHTML = `Código gerado (simulado): <strong>${code}</strong>. Vai para a secção de confirmação.`;
      // avançar para passo 2
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
      // guardar email temporariamente no DOM
      document.getElementById('step2').dataset.resetEmail = email;
    });

    document.getElementById('confirmBtn').addEventListener('click', ()=> {
      const code = (document.getElementById('codeInput').value || '').trim();
      const newP = document.getElementById('newPass').value || '';
      const conf = document.getElementById('confirmPass').value || '';
      const msg = document.getElementById('msg2'); msg.textContent = '';
      const email = document.getElementById('step2').dataset.resetEmail;
      if (!email) { msg.textContent = 'Fluxo inválido. Volta a pedir código.'; return; }
      if (!code || code.length !== 4) { msg.textContent = 'Insere o código de 4 dígitos.'; return; }
      if (!newP || !conf) { msg.textContent = 'Preenche a nova senha e a confirmação.'; return; }
      if (newP !== conf) { msg.textContent = 'A confirmação não coincide.'; return; }
      const codes = readCodes();
      const entry = codes.find(c => c.email === email && c.code === code);
      if (!entry) { msg.textContent = 'Código inválido.'; return; }
      if (new Date(entry.expiresAt) < new Date()) { msg.textContent = 'Código expirou. Pede um novo.'; return; }
      // atualizar senha do utilizador
      const users = DB.getUsers();
      const idx = users.findIndex(u => (u.email||'').toLowerCase() === email);
      if (idx === -1) { msg.textContent = 'Utilizador não encontrado.'; return; }
      users[idx].password = newP;
      DB.saveUsers(users);
      // remover código usado
      const remaining = codes.filter(c => !(c.email === email && c.code === code));
      writeCodes(remaining);
      msg.textContent = 'Senha alterada com sucesso. Vais ser redirecionado para o login.';
      setTimeout(()=> { location.href = 'index.html'; }, 1400);
    });

  })();
  </script>
</body>
</html>
