<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Book-face — Mudar Senha</title>
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="layout.css" />
  <style>
    body{font-family:Inter,system-ui,Arial,Helvetica,sans-serif;background:#f3f6fb;margin:0;color:#0f172a}
    .topbar{background:#fff;box-shadow:0 2px 8px rgba(2,6,23,0.04);position:sticky;top:0}
    .topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
    .container{max-width:720px;margin:18px auto;padding:12px}
    .card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 6px 18px rgba(2,6,23,0.04)}
    .field{display:flex;flex-direction:column;margin-bottom:12px}
    .field input{padding:10px;border-radius:8px;border:1px solid #e6eef6}
    .muted{color:#6b7280}
    .actions{display:flex;gap:8px}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div><a href="settings.html" class="link">Voltar</a></div>
      <div style="font-weight:700">Mudar Senha</div>
      <div></div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h3>Alterar senha</h3>
      <p class="muted">Para alterar a senha, confirma a senha atual. Se não te lembras, usa "Esqueci senha".</p>

      <div class="field">
        <label>Senha atual</label>
        <input id="oldPass" type="password" placeholder="Senha atual">
      </div>

      <div class="field">
        <label>Nova senha</label>
        <input id="newPass" type="password" placeholder="Nova senha">
      </div>

      <div class="field">
        <label>Confirmar nova senha</label>
        <input id="confirmPass" type="password" placeholder="Confirmar nova senha">
      </div>

      <div class="actions">
        <button id="saveBtn" class="btn small">Guardar</button>
        <button id="forgotBtn" class="btn small">Esqueci senha</button>
      </div>

      <div id="msg" style="margin-top:12px"></div>
    </section>
  </main>

  <script>
  (function(){
    const session = DB.getSession();
    if (!session) { alert('Sessão não encontrada. Faz login.'); location.href='index.html'; return; }
    const users = DB.getUsers();
    const meIndex = users.findIndex(u => (u.email||'').toLowerCase() === session);
    if (meIndex === -1) { alert('Utilizador não encontrado.'); location.href='index.html'; return; }

    document.getElementById('saveBtn').addEventListener('click', ()=> {
      const oldP = document.getElementById('oldPass').value || '';
      const newP = document.getElementById('newPass').value || '';
      const conf = document.getElementById('confirmPass').value || '';
      const msg = document.getElementById('msg');
      msg.textContent = '';
      if (!oldP || !newP || !conf) { msg.textContent = 'Preenche todos os campos.'; return; }
      const users = DB.getUsers();
      const me = users[meIndex];
      if (me.password !== oldP) { msg.textContent = 'Senha atual incorreta.'; return; }
      if (newP.length < 4) { msg.textContent = 'A nova senha deve ter pelo menos 4 caracteres.'; return; }
      if (newP !== conf) { msg.textContent = 'A confirmação não coincide.'; return; }
      users[meIndex].password = newP;
      DB.saveUsers(users);
      msg.textContent = 'Senha alterada com sucesso.';
      setTimeout(()=> { location.href='settings.html'; }, 1200);
    });

    document.getElementById('forgotBtn').addEventListener('click', ()=> location.href='forgot_password.html');

  })();
  </script>
</body>
</html>
