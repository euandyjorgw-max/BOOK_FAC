<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Book-Face — Iniciar sessão</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h2>Iniciar sessão</h2>
    <form id="loginForm">
      <label>Email
        <input id="loginEmail" type="email" required>
      </label>
      <label>Senha
        <input id="loginPassword" type="password" required>
      </label>
      <div class="row">
        <button type="submit" class="btn">Entrar</button>
        <a href="forgot.html" class="btn outline small">Esqueci senha</a>
      </div>
      <p id="loginMsg" class="error" aria-live="polite"></p>
      <p class="muted">Não tem conta? <a href="signup.html">Criar conta</a></p>
    </form>
  </main>

  <script src="auth.js"></script>
</body>
</html>
