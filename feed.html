<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Book-face — Feed</title>

  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="layout.css" />
  <link rel="stylesheet" href="components.css" />

  <style>
    :root{
      --card:#ffffff;
      --muted:#6b7280;
      --primary:#0b5ed7;
      --accent1:#ff5a5f;
      --accent2:#ffb400;
      --accent3:#7c4dff;
      --accent4:#00c2a8;
      --accent5:#ff4da6;
      --shadow:0 8px 24px rgba(2,6,23,0.08);
    }

    body{background:#f0f6fb;font-family:Inter,system-ui,Arial,Helvetica,sans-serif;color:#0f172a;margin:0}
    .topbar{background:linear-gradient(90deg,#ffffff 0%, #f8fbff 100%);box-shadow:0 2px 8px rgba(2,6,23,0.04);position:sticky;top:0;z-index:60}
    .topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:12px}
    .feed-panel{max-width:1100px;margin:14px auto;padding:12px;display:flex;gap:16px}
    .left-col{flex:1}
    .right-col{width:300px}

    .card{background:var(--card);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
    .status-strip{display:flex;gap:12px;align-items:flex-start;overflow:auto;padding:12px 6px}
    .status-slot{width:110px;flex:0 0 110px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
    .status-ring{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(2,6,23,0.06);position:relative}
    .status-ring.empty{background:linear-gradient(180deg,#f1f5f9,#eef2ff);border:2px dashed rgba(15,23,42,0.06)}
    .status-avatar{width:74px;height:74px;border-radius:50%;object-fit:cover;border:3px solid #fff}
    .status-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:center}
    .status-time{font-size:11px;color:var(--muted)}

    .ring-1{background:linear-gradient(135deg,var(--accent1),#ff7b7f)}
    .ring-2{background:linear-gradient(135deg,var(--accent2),#ffd36b)}
    .ring-3{background:linear-gradient(135deg,var(--accent3),#9b7bff)}
    .ring-4{background:linear-gradient(135deg,var(--accent4),#3fe0c0)}
    .ring-5{background:linear-gradient(135deg,var(--accent5),#ff7bbf)}

    .post{margin-top:12px;padding:14px;border-radius:12px;background:#fff;box-shadow:0 6px 18px rgba(2,6,23,0.04)}
    .post .meta{display:flex;gap:12px;align-items:center}
    .post .meta img{width:48px;height:48px;border-radius:10px;object-fit:cover}
    .post .content{margin-top:10px;white-space:pre-wrap}
    .post .media{margin-top:10px}
    .post .media img{max-width:100%;border-radius:10px;cursor:pointer}
    .post .media video{max-width:100%;border-radius:10px;display:block}
    .post .actions{display:flex;gap:8px;margin-top:10px;align-items:center}
    .reaction-list{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
    .comments{margin-top:10px}

    .media-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.75);z-index:400}
    .media-modal .inner{max-width:95%;max-height:95%;display:flex;align-items:center;justify-content:center}
    .media-modal img, .media-modal video{max-width:100%;max-height:100%;border-radius:8px}

    .feed-footer{max-width:1100px;margin:8px auto 40px;padding:6px 12px;text-align:center;color:#0b3f6b;font-weight:700;font-size:13px}

    /* nav */
    .nav-center { display:flex; gap:8px; align-items:center; justify-content:center; flex:1; }
    .nav-btn { background:transparent; border:none; padding:8px 10px; border-radius:8px; cursor:pointer; font-size:18px; display:inline-flex; align-items:center; justify-content:center; position:relative; }
    .nav-btn:hover { background:rgba(11,116,209,0.06); transform:translateY(-1px); }
    .nav-btn.active { background:rgba(11,116,209,0.10); color:var(--primary); }
    .nav-avatar { width:30px; height:30px; border-radius:8px; object-fit:cover; display:block; }
    .nav-right { display:flex; align-items:center; gap:8px; }
    .top-search { padding:8px 10px; border-radius:999px; border:1px solid #e6eef6; min-width:140px; }

    .nav-badge { min-width:18px; height:18px; background:#e11d48; color:#fff; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; font-size:12px; padding:0 6px; margin-left:6px; }

    /* reaction popup */
    .reaction-popup {
      position: absolute;
      display: flex;
      gap: 8px;
      background: #fff;
      padding: 6px 8px;
      border-radius: 999px;
      box-shadow: 0 6px 18px rgba(2,6,23,0.12);
      z-index: 9999;
      transform-origin: bottom center;
    }
    .reaction-popup button {
      background: transparent;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }
    .reaction-popup button:hover { transform: translateY(-4px); }

    @media (max-width:900px){
      .feed-panel{flex-direction:column;padding:8px}
      .right-col{width:100%}
      .status-slot{flex:0 0 86px}
      .status-ring{width:68px;height:68px}
      .status-avatar{width:58px;height:58px}
    }
  </style>
</head>
<body>

  <!-- Header with icons: Início, Pedidos, Mensagens, Notificações, Definições, Perfil -->
  <header class="topbar">
    <div class="topbar-inner">
      <div style="display:flex;align-items:center;gap:12px">
        <img src="logo.png" alt="Book-face" style="height:34px">
      </div>

      <nav class="nav-center" role="navigation" aria-label="Navegação principal">
        <button class="nav-btn" data-target="feed.html" id="nav-home" title="Início">🏠</button>

        <button class="nav-btn" data-target="friend_requests.html" id="nav-requests" title="Pedidos">
          👥
          <span class="nav-badge" id="badge-requests" aria-hidden="true"></span>
        </button>

        <button class="nav-btn" data-target="messages.html" id="nav-messages" title="Mensagens">
          💬
          <span class="nav-badge" id="badge-messages" aria-hidden="true"></span>
        </button>

        <button class="nav-btn" data-target="notifications.html" id="nav-notifs" title="Notificações">
          🔔
          <span class="nav-badge" id="badge-notifs" aria-hidden="true"></span>
        </button>

        <button class="nav-btn" data-target="settings.html" id="nav-settings" title="Definições">⚙️</button>

      </nav>

      <div class="nav-right">
        <input id="topSearch" class="top-search" placeholder="Pesquisar no Book-face">
      </div>
    </div>
  </header>

  <main class="feed-panel">
    <div class="left-col">
      <!-- Stories strip -->
      <section class="card" style="margin-bottom:12px;padding-bottom:6px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <strong style="font-size:16px">Stories</strong>
          <div style="display:flex;gap:8px;align-items:center">
            <button id="addStatusBtn" class="btn small">Adicionar status</button>
            <button id="createPostBtn" class="btn small">Criar publicação</button>
          </div>
        </div>

        <div class="status-strip" id="statusStrip" aria-live="polite"></div>
      </section>

      <!-- Feed posts -->
      <section id="feed" aria-live="polite"></section>

      <div style="text-align:center;margin-top:12px"><button id="loadMore" class="btn">Carregar mais</button></div>
    </div>

    <aside class="right-col">
      <div class="card" style="margin-bottom:12px">
        <strong>Sugestões</strong>
        <div id="suggestions" style="margin-top:8px"></div>
      </div>

      <div class="card">
        <strong>Tendências</strong>
        <div style="margin-top:8px" class="muted">Sem tendências por enquanto.</div>
      </div>
    </aside>
  </main>

  <div id="mediaModal" class="media-modal" role="dialog" aria-hidden="true">
    <div class="inner" id="mediaHolder"></div>
    <button id="closeMedia" class="btn small" style="position:fixed;top:18px;right:18px;z-index:410">Fechar</button>
  </div>

  <div class="feed-footer">💦EWANDY D PT💦</div>

  <!-- SCRIPTS INLINE: storage, friends, nav (integrado), feed -->
  <script>
  /* storage.js inline */
  const DB = (function(){
    const keys = {
      users: 'bf_users',
      session: 'bf_session',
      posts: 'bf_posts',
      statuses: 'bf_statuses',
      friendRequests: 'bf_friendRequests',
      friends: 'bf_friends',
      conversations: 'bf_conversations',
      notifications: 'bf_notifications'
    };
    function read(k){ return JSON.parse(localStorage.getItem(k) || '[]'); }
    function write(k, v){ localStorage.setItem(k, JSON.stringify(v)); }
    function ensureInit(){ Object.values(keys).forEach(k => { if (!localStorage.getItem(k)) localStorage.setItem(k, '[]'); }); }
    function seedDemoUsers(){
      const users = read(keys.users);
      if (users.length) return;
      const demo = [
        { name: 'Ana Silva', email: 'ana@example.com', password: '1234', avatar:'avatar-default.png' },
        { name: 'João Pereira', email: 'joao@example.com', password: '1234', avatar:'avatar-default.png' },
        { name: 'Maria Costa', email: 'maria@example.com', password: '1234', avatar:'avatar-default.png' },
        { name: 'Pedro Gomes', email: 'pedro@example.com', password: '1234', avatar:'avatar-default.png' }
      ];
      write(keys.users, demo);
    }
    function pushNotification(to, from, type, text, meta = {}){
      const nots = read(keys.notifications);
      const n = { id: 'n'+Date.now()+Math.floor(Math.random()*999), to, from, type, text, time: new Date().toISOString(), read:false, meta };
      nots.unshift(n);
      write(keys.notifications, nots);
      return n;
    }
    function findConversationBetween(a, b){
      const convs = read(keys.conversations);
      return convs.find(c => Array.isArray(c.members) && c.members.length === 2 &&
        ((c.members[0] === a && c.members[1] === b) || (c.members[0] === b && c.members[1] === a)));
    }
    function createConversation(a, b){
      const convs = read(keys.conversations);
      const id = 'conv' + Date.now() + Math.floor(Math.random()*999);
      const conv = { id, members: [a,b], messages: [], lastSeen: {} };
      convs.push(conv);
      write(keys.conversations, convs);
      return conv;
    }
    ensureInit();
    seedDemoUsers();
    return {
      getUsers(){ return read(keys.users); },
      saveUsers(u){ write(keys.users, u); },
      setSession(email){ localStorage.setItem(keys.session, (email||'').toLowerCase()); },
      getSession(){ return (localStorage.getItem(keys.session) || '').toLowerCase(); },
      clearSession(){ localStorage.removeItem(keys.session); },
      getPosts(){ return read(keys.posts); },
      savePosts(p){ write(keys.posts, p); },
      getStatuses(){ return read(keys.statuses); },
      saveStatuses(s){ write(keys.statuses, s); },
      getFriendRequests(){ return read(keys.friendRequests); },
      saveFriendRequests(r){ write(keys.friendRequests, r); },
      getFriends(){ return read(keys.friends); },
      saveFriends(f){ write(keys.friends, f); },
      getConversations(){ return read(keys.conversations); },
      saveConversations(c){ write(keys.conversations, c); },
      getNotifications(){ return read(keys.notifications); },
      saveNotifications(n){ write(keys.notifications, n); },
      pushNotification,
      findConversationBetween,
      createConversation
    };
  })();
  </script>

  <script>
  /* friends.js inline */
  const Friendship = (function(DB){
    function sendRequestTo(email){
      const session = DB.getSession();
      if (!session) throw new Error('Sem sessão');
      if ((email||'').toLowerCase() === session) return;
      const reqs = DB.getFriendRequests();
      const exists = reqs.find(r => r.from === session && r.to === email && r.status === 'pending');
      if (exists) return exists;
      const r = { id: 'fr'+Date.now()+Math.floor(Math.random()*999), from: session, to: email, status: 'pending', time: new Date().toISOString() };
      reqs.unshift(r);
      DB.saveFriendRequests(reqs);
      DB.pushNotification(email, session, 'friend_request', `${session} enviou um pedido de amizade`, { requestId: r.id });
      return r;
    }
    function acceptRequestFrom(email){
      const session = DB.getSession();
      const reqs = DB.getFriendRequests();
      const idx = reqs.findIndex(r => r.from === email && r.to === session && r.status === 'pending');
      if (idx === -1) return false;
      reqs[idx].status = 'accepted';
      DB.saveFriendRequests(reqs);
      const friends = DB.getFriends();
      friends.push({ id: 'f'+Date.now()+Math.floor(Math.random()*999), a: session, b: email, time: new Date().toISOString() });
      DB.saveFriends(friends);
      DB.pushNotification(email, session, 'friend_accept', `${session} aceitou o seu pedido de amizade`, { });
      return true;
    }
    function declineRequestFrom(email){
      const session = DB.getSession();
      const reqs = DB.getFriendRequests();
      const idx = reqs.findIndex(r => r.from === email && r.to === session && r.status === 'pending');
      if (idx === -1) return false;
      reqs[idx].status = 'declined';
      DB.saveFriendRequests(reqs);
      return true;
    }
    function cancelRequestTo(email){
      const session = DB.getSession();
      let reqs = DB.getFriendRequests();
      reqs = reqs.filter(r => !(r.from === session && r.to === email && r.status === 'pending'));
      DB.saveFriendRequests(reqs);
      return true;
    }
    function removeFriend(email){
      const session = DB.getSession();
      let friends = DB.getFriends();
      friends = friends.filter(f => !((f.a === session && f.b === email) || (f.b === session && f.a === email)));
      DB.saveFriends(friends);
      return true;
    }
    function startConversationWith(email){
      const session = DB.getSession();
      if (!session) throw new Error('Sem sessão');
      if ((email||'').toLowerCase() === session) throw new Error('Não pode conversar consigo mesmo');
      let conv = DB.findConversationBetween(session, email);
      if (conv) return conv;
      conv = DB.createConversation(session, email);
      DB.pushNotification(email, session, 'conversation_started', `${session} iniciou uma conversa`, { convId: conv.id });
      return conv;
    }
    function getConversations(){ return DB.getConversations(); }
    function getFriendsList(){ return DB.getFriends(); }
    function getFriendRequestsList(){ return DB.getFriendRequests(); }
    return {
      sendRequestTo,
      acceptRequestFrom,
      declineRequestFrom,
      cancelRequestTo,
      removeFriend,
      startConversationWith,
      getConversations,
      getFriendsList,
      getFriendRequestsList
    };
  })(DB);
  </script>

  <script>
  /* nav (integrado) */
  (function(){
    // navigation by data-target
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.getAttribute('data-target');
        if (!target) return;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        window.location.href = target;
      });
    });

    // highlight active based on filename
    (function highlightActive(){
      const path = location.pathname.split('/').pop() || 'feed.html';
      const map = { 'feed.html':'nav-home', 'friend_requests.html':'nav-requests', 'messages.html':'nav-messages', 'notifications.html':'nav-notifs', 'settings.html':'nav-settings', 'profile.html':'nav-profile' };
      const id = map[path];
      if (id) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        const el = document.getElementById(id);
        if (el) el.classList.add('active');
      }
    })();

    // badges update
    function updateBadges(){
      const session = DB.getSession();
      if (!session) return;
      const reqs = DB.getFriendRequests().filter(r => r.to === session && r.status === 'pending').length;
      const convs = DB.getConversations() || [];
      const unreadMsgs = convs.reduce((acc,c) => acc + (Array.isArray(c.messages) ? c.messages.filter(m => m.to === session && !m.read).length : 0), 0);
      const notifs = DB.getNotifications().filter(n => n.to === session && !n.read).length;
      const bReq = document.getElementById('badge-requests');
      const bMsg = document.getElementById('badge-messages');
      const bNot = document.getElementById('badge-notifs');
      if (bReq) { bReq.textContent = reqs || ''; bReq.style.display = reqs ? 'inline-flex' : 'none'; }
      if (bMsg) { bMsg.textContent = unreadMsgs || ''; bMsg.style.display = unreadMsgs ? 'inline-flex' : 'none'; }
      if (bNot) { bNot.textContent = notifs || ''; bNot.style.display = notifs ? 'inline-flex' : 'none'; }
    }
    updateBadges();
    setInterval(updateBadges, 2000);
  })();
  </script>

  <script>
  /* feed.js inline (reactions, comments, share, statuses) */
  (function(){
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]); }
    const session = DB.getSession();
    if (!session) { /* if no session, redirect to login if exists */ }

    const statusStrip = document.getElementById('statusStrip');
    const feedEl = document.getElementById('feed');
    const suggestions = document.getElementById('suggestions');
    const mediaModal = document.getElementById('mediaModal');
    const mediaHolder = document.getElementById('mediaHolder');
    const closeMedia = document.getElementById('closeMedia');
    const loadMoreBtn = document.getElementById('loadMore');

    let posts = DB.getPosts() || [];
    let statuses = DB.getStatuses() || [];
    let page = 0;
    const pageSize = 6;
    const rings = ['ring-1','ring-2','ring-3','ring-4','ring-5'];

    const EMOJIS = { like:'👍', love:'❤️', wow:'😮', sad:'😢', angry:'😡' };
    const EMO_KEYS = Object.keys(EMOJIS);

    function renderAll(){ posts = DB.getPosts() || []; statuses = DB.getStatuses() || []; renderStatuses(); renderFeed(); renderSuggestions(); }

    function renderStatuses(){
      const now = new Date();
      statuses = statuses.filter(s => new Date(s.expiresAt) > now);
      DB.saveStatuses(statuses);
      statusStrip.innerHTML = '';
      const me = DB.getUsers().find(u => (u.email||'').toLowerCase() === session);
      const myStatus = statuses.find(s => s.authorEmail === session);
      statusStrip.appendChild(createStatusSlot({ name: me ? me.name : 'Você', avatar: me ? me.avatar : 'avatar-default.png', status: myStatus || null, isMine: true, ringClass: myStatus ? rings[0] : 'empty' }));
      const friends = DB.getFriends().filter(f => f.a === session || f.b === session).map(f => (f.a === session ? f.b : f.a));
      const friendStatuses = statuses.filter(s => s.authorEmail !== session && friends.includes(s.authorEmail));
      const maxSlots = 10;
      for (let i=0;i<maxSlots;i++){
        const s = friendStatuses[i];
        if (s) {
          const u = DB.getUsers().find(u => (u.email||'').toLowerCase() === (s.authorEmail||'').toLowerCase()) || { name: s.authorEmail, avatar:'avatar-default.png' };
          statusStrip.appendChild(createStatusSlot({ name: u.name, avatar: u.avatar, status: s, isMine:false, ringClass: rings[(i+1)%rings.length] }));
        } else {
          statusStrip.appendChild(createEmptySlot(i));
        }
      }
    }

    function createStatusSlot({name, avatar, status, isMine, ringClass}){
      const slot = document.createElement('div'); slot.className = 'status-slot';
      const ring = document.createElement('div'); ring.className = 'status-ring ' + (status ? ringClass : 'empty');
      const img = document.createElement('img'); img.className = 'status-avatar'; img.src = avatar || 'avatar-default.png';
      ring.appendChild(img); slot.appendChild(ring);
      const nm = document.createElement('div'); nm.className = 'status-name'; nm.textContent = name; slot.appendChild(nm);
      const time = document.createElement('div'); time.className = 'status-time';
      time.textContent = status ? new Date(status.time).toLocaleTimeString() : (isMine ? 'Adicionar' : 'Vazio');
      slot.appendChild(time);
      slot.addEventListener('click', ()=> { if (isMine) location.href = 'status.html'; else if (status) showStatusModal(status); else alert('Ainda não há status aqui.'); });
      return slot;
    }

    function createEmptySlot(index){
      const slot = document.createElement('div'); slot.className = 'status-slot';
      const ring = document.createElement('div'); ring.className = 'status-ring empty';
      ring.innerHTML = `<div style="font-size:22px;color:rgba(15,23,42,0.12)">+</div>`;
      slot.appendChild(ring);
      const nm = document.createElement('div'); nm.className = 'status-name'; nm.textContent = 'Vazio'; slot.appendChild(nm);
      const time = document.createElement('div'); time.className = 'status-time'; time.textContent = ''; slot.appendChild(time);
      slot.addEventListener('click', ()=> alert('Ainda não há status aqui.'));
      return slot;
    }

    function showStatusModal(s){
      mediaHolder.innerHTML = '';
      const container = document.createElement('div');
      container.style.padding = '18px';
      container.style.background = s.bgColor || '#0b5ed7';
      container.style.borderRadius = '12px';
      container.style.color = '#fff';
      container.style.maxWidth = '420px';
      container.innerHTML = `<div style="font-size:18px;margin-bottom:8px">${escapeHtml(s.text)}</div>`;
      if (s.image) { const img = document.createElement('img'); img.src = s.image; img.style.maxWidth='100%'; container.appendChild(img); }
      if (s.video) { const v = document.createElement('video'); v.src = s.video; v.controls = true; v.style.maxWidth='100%'; container.appendChild(v); }
      mediaHolder.appendChild(container);
      mediaModal.style.display = 'flex';
    }

    closeMedia.addEventListener('click', ()=> { mediaModal.style.display = 'none'; mediaHolder.innerHTML = ''; });

    function renderFeed(){
      feedEl.innerHTML = '';
      const friends = DB.getFriends();
      const visible = posts.filter(p => {
        if (p.privacy === 'public') return true;
        if (p.privacy === 'onlyme') return p.authorEmail === session;
        if (p.privacy === 'friends') {
          return friends.some(f => (f.a === session && f.b === p.authorEmail) || (f.b === session && f.a === p.authorEmail)) || p.authorEmail === session;
        }
        return true;
      });
      const start = page * pageSize;
      const items = visible.slice(start, start + pageSize);
      items.forEach(p => feedEl.appendChild(postElement(p)));
      loadMoreBtn.style.display = (start + pageSize >= visible.length) ? 'none' : 'block';
    }

    function postElement(post){
      const div = document.createElement('div'); div.className = 'post card';
      const time = new Date(post.time).toLocaleString();
      div.innerHTML = `
        <div class="meta">
          <img src="${post.avatar||'avatar-default.png'}" alt="">
          <div style="flex:1">
            <strong>${escapeHtml(post.name)}</strong>
            <div class="muted" style="font-size:12px">${time} • ${escapeHtml(post.privacy)}</div>
          </div>
          <div>${post.authorEmail === session ? '<button class="btn small editBtn">Editar</button> <button class="btn small danger deleteBtn">Apagar</button>' : ''}</div>
        </div>
        <div class="content">${post.text ? escapeHtml(post.text) : ''}</div>
        <div class="media"></div>
        <div class="actions">
          <button class="btn small likeBtn" data-post="${post.id}">👍 <span class="count-like">${post.reactions?.like||0}</span></button>
          <button class="btn small reactBtn" data-post="${post.id}">❤️</button>
          <button class="btn small commentToggle" data-post="${post.id}">Comentários (${post.comments?.length||0})</button>
          <button class="btn small shareBtn" data-post="${post.id}">Partilhar</button>
        </div>
        <div class="reaction-list" data-post="${post.id}" style="margin-top:8px"></div>
        <div class="comments" data-post="${post.id}" style="display:none;margin-top:8px"></div>
      `;
      const mediaWrap = div.querySelector('.media');
      if (post.image) {
        const img = document.createElement('img'); img.src = post.image; img.alt='foto';
        img.addEventListener('click', ()=> { mediaHolder.innerHTML = `<img src="${post.image}">`; mediaModal.style.display='flex'; });
        mediaWrap.appendChild(img);
      } else if (post.video) {
        const v = document.createElement('video'); v.src = post.video; v.controls = true; mediaWrap.appendChild(v);
      }
      const reactionList = div.querySelector('.reaction-list');
      reactionList.innerHTML = renderReactionSummary(post);
      const commentsWrap = div.querySelector('.comments');
      commentsWrap.innerHTML = renderCommentsHtml(post);
      div.querySelectorAll('[data-post]').forEach(el => el.dataset.post = post.id);
      return div;
    }

    function renderReactionSummary(post){
      const parts = [];
      const reactions = post.reactions || {};
      for (const k of EMO_KEYS) {
        if (reactions[k]) parts.push(`${EMOJIS[k]} ${reactions[k]}`);
      }
      return parts.join('  ');
    }

    function renderCommentsHtml(post){
      const comments = post.comments || [];
      const top = comments.filter(c => !c.parentId);
      const container = document.createElement('div');
      top.forEach(c => {
        const el = document.createElement('div');
        el.style.padding='8px'; el.style.borderRadius='8px'; el.style.background='#f8fafc'; el.style.marginBottom='6px';
        el.innerHTML = `<strong>${escapeHtml(c.name)}</strong> <span class="muted" style="font-size:12px">${new Date(c.time).toLocaleString()}</span><div style="margin-top:6px">${escapeHtml(c.text)}</div>
          <div style="margin-top:6px"><button class="btn tiny replyBtn" data-comment="${c.id}" data-post="${post.id}">Responder</button></div>`;
        const replies = comments.filter(r => r.parentId === c.id);
        if (replies.length) {
          const repWrap = document.createElement('div'); repWrap.style.marginTop='8px'; repWrap.style.marginLeft='12px';
          replies.forEach(r => {
            const rEl = document.createElement('div'); rEl.style.padding='6px'; rEl.style.background='#fff'; rEl.style.borderRadius='6px'; rEl.style.marginBottom='6px';
            rEl.innerHTML = `<strong>${escapeHtml(r.name)}</strong> <div class="muted" style="font-size:12px">${new Date(r.time).toLocaleString()}</div><div>${escapeHtml(r.text)}</div>`;
            repWrap.appendChild(rEl);
          });
          el.appendChild(repWrap);
        }
        container.appendChild(el);
      });
      const inputRow = document.createElement('div');
      inputRow.style.display='flex'; inputRow.style.gap='8px'; inputRow.style.marginTop='8px';
      inputRow.innerHTML = `<input class="commentInput" placeholder="Escrever um comentário..." style="flex:1;padding:8px;border-radius:8px;border:1px solid #e6eef6"><button class="btn small commentSend" data-post="">Enviar</button>`;
      container.appendChild(inputRow);
      return container.innerHTML;
    }

    let reactionPopup = null;
    function showReactionPopup(targetEl, postId){
      hideReactionPopup();
      reactionPopup = document.createElement('div');
      reactionPopup.className = 'reaction-popup';
      EMO_KEYS.forEach(k => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.innerText = EMOJIS[k];
        btn.title = k;
        btn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          applyReaction(postId, k);
          hideReactionPopup();
        });
        reactionPopup.appendChild(btn);
      });
      document.body.appendChild(reactionPopup);
      const rect = targetEl.getBoundingClientRect();
      reactionPopup.style.left = (rect.left + rect.width/2 - reactionPopup.offsetWidth/2) + 'px';
      reactionPopup.style.top = (rect.top - reactionPopup.offsetHeight - 8) + 'px';
    }
    function hideReactionPopup(){ if (reactionPopup && reactionPopup.parentNode) reactionPopup.parentNode.removeChild(reactionPopup); reactionPopup = null; }

    function applyReaction(postId, emojiKey){
      posts = DB.getPosts() || [];
      const post = posts.find(p => p.id === postId);
      if (!post) return;
      post.reactions = post.reactions || {};
      post.userReactions = post.userReactions || {};
      const prev = post.userReactions[session];
      if (prev === emojiKey) {
        post.reactions[prev] = Math.max(0,(post.reactions[prev]||1)-1);
        delete post.userReactions[session];
      } else {
        if (prev) post.reactions[prev] = Math.max(0,(post.reactions[prev]||1)-1);
        post.reactions[emojiKey] = (post.reactions[emojiKey]||0) + 1;
        post.userReactions[session] = emojiKey;
      }
      DB.savePosts(posts);
      renderFeed();
    }

    function toggleLike(postId){ applyReaction(postId, 'like'); }

    function sendComment(postId, text, parentId = null){
      if (!text || !text.trim()) return;
      posts = DB.getPosts() || [];
      const post = posts.find(p => p.id === postId);
      if (!post) return;
      post.comments = post.comments || [];
      const me = DB.getUsers().find(u => (u.email||'').toLowerCase() === session);
      const comment = { id: 'c'+Date.now(), authorEmail: session, name: me ? me.name : session, text: text.trim(), time: new Date().toISOString(), parentId: parentId || null };
      post.comments.push(comment);
      DB.savePosts(posts);
      if (post.authorEmail !== session) DB.pushNotification(post.authorEmail, session, 'comment', `${me ? me.name : session} comentou na sua publicação`, { postId: post.id, commentId: comment.id });
      renderFeed();
    }

    function replyToComment(postId, parentCommentId, replyText){
      sendComment(postId, replyText, parentCommentId);
      posts = DB.getPosts() || [];
      const post = posts.find(p => p.id === postId);
      if (!post) return;
      const parent = post.comments.find(x => x.id === parentCommentId);
      if (parent && parent.authorEmail !== session) {
        const me = DB.getUsers().find(u => (u.email||'').toLowerCase() === session);
        DB.pushNotification(parent.authorEmail, session, 'reply', `${me ? me.name : session} respondeu ao seu comentário`, { postId: post.id, parentId: parentCommentId });
      }
    }

    function sharePost(postId){
      posts = DB.getPosts() || [];
      const original = posts.find(p => p.id === postId);
      if (!original) return;
      const me = DB.getUsers().find(u => (u.email||'').toLowerCase() === session);
      const shared = {
        id: 'p'+Date.now(),
        authorEmail: session,
        name: me ? me.name : session,
        avatar: me ? me.avatar : 'avatar-default.png',
        text: `Compartilhou: ${original.text || ''}`,
        image: original.image || null,
        video: original.video || null,
        time: new Date().toISOString(),
        reactions: {}, userReactions: {}, comments: [], privacy: 'public'
      };
      posts.unshift(shared);
      DB.savePosts(posts);
      renderFeed();
    }

    feedEl.addEventListener('click', (e) => {
      const likeBtn = e.target.closest('.likeBtn');
      if (likeBtn) { const postId = likeBtn.dataset.post; toggleLike(postId); return; }
      const reactBtn = e.target.closest('.reactBtn');
      if (reactBtn) { const postId = reactBtn.dataset.post; showReactionPopup(reactBtn, postId); return; }
      const shareBtn = e.target.closest('.shareBtn');
      if (shareBtn) { const postId = shareBtn.dataset.post; sharePost(postId); return; }
      const commentToggle = e.target.closest('.commentToggle');
      if (commentToggle) {
        const postId = commentToggle.dataset.post;
        const commentsWrap = feedEl.querySelector(`.comments[data-post="${postId}"]`);
        if (!commentsWrap) return;
        commentsWrap.style.display = commentsWrap.style.display === 'none' ? 'block' : 'none';
        posts = DB.getPosts() || [];
        const post = posts.find(p => p.id === postId);
        if (post) commentsWrap.innerHTML = renderCommentsHtml(post);
        const sendBtn = commentsWrap.querySelector('.commentSend');
        if (sendBtn) sendBtn.dataset.post = postId;
        return;
      }
      const replyBtn = e.target.closest('.replyBtn');
      if (replyBtn) {
        const parentId = replyBtn.dataset.comment;
        const postId = replyBtn.dataset.post;
        const replyText = prompt('Responder ao comentário:');
        if (replyText && replyText.trim()) replyToComment(postId, parentId, replyText.trim());
        return;
      }
      const commentSend = e.target.closest('.commentSend');
      if (commentSend) {
        const postId = commentSend.dataset.post || (() => {
          const container = commentSend.closest('.comments');
          return container ? container.dataset.post : null;
        })();
        if (!postId) return;
        const input = commentSend.parentElement.querySelector('.commentInput');
        if (!input) return;
        const text = input.value || '';
        if (!text.trim()) return;
        sendComment(postId, text);
        return;
      }
      const deleteBtn = e.target.closest('.deleteBtn');
      if (deleteBtn) {
        const postDiv = deleteBtn.closest('.post');
        const postId = postDiv && postDiv.querySelector('[data-post]') ? postDiv.querySelector('[data-post]').dataset.post : null;
        if (!postId) return;
        if (!confirm('Apagar esta publicação?')) return;
        posts = DB.getPosts() || [];
        posts = posts.filter(p => p.id !== postId);
        DB.savePosts(posts);
        renderFeed();
        return;
      }
      const editBtn = e.target.closest('.editBtn');
      if (editBtn) {
        const postDiv = editBtn.closest('.post');
        const postId = postDiv && postDiv.querySelector('[data-post]') ? postDiv.querySelector('[data-post]').dataset.post : null;
        if (!postId) return;
        const postsArr = DB.getPosts() || [];
        const post = postsArr.find(p => p.id === postId);
        if (!post) return;
        const newText = prompt('Editar publicação', post.text || '');
        if (newText !== null) { post.text = newText; DB.savePosts(postsArr); renderFeed(); }
        return;
      }
    });

    feedEl.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const input = e.target;
      if (!input.classList.contains('commentInput')) return;
      e.preventDefault();
      const postContainer = input.closest('.comments');
      if (!postContainer) return;
      const postId = postContainer.dataset.post;
      const text = input.value || '';
      if (!text.trim()) return;
      sendComment(postId, text);
    });

    document.addEventListener('click', (e) => {
      if (reactionPopup && !reactionPopup.contains(e.target) && !e.target.closest('.reactBtn')) hideReactionPopup();
    });

    function renderSuggestions(){
      suggestions.innerHTML = '';
      const all = DB.getUsers().filter(u => (u.email||'').toLowerCase() !== session);
      const friends = DB.getFriends();
      const notFriends = all.filter(u => !friends.some(f => (f.a===session && f.b===u.email) || (f.b===session && f.a===u.email)));
      notFriends.slice(0,4).forEach(u => {
        const div = document.createElement('div'); div.style.display='flex';div.style.justifyContent='space-between';div.style.marginBottom='8px';
        div.innerHTML = `<div style="display:flex;gap:8px;align-items:center"><img src="${u.avatar||'avatar-default.png'}" style="width:44px;height:44px;border-radius:8px"><div><strong>${escapeHtml(u.name)}</strong><div class="muted" style="font-size:12px">${escapeHtml(u.email)}</div></div></div><div><button class="btn small addFriendBtn" data-email="${escapeHtml(u.email)}">Adicionar</button></div>`;
        suggestions.appendChild(div);
      });
      suggestions.querySelectorAll('.addFriendBtn').forEach(b => b.addEventListener('click', ()=> { Friendship.sendRequestTo(b.getAttribute('data-email')); b.textContent='Enviado'; b.disabled=true; }));
    }

    window.addEventListener('storage', (e) => {
      posts = DB.getPosts() || [];
      statuses = DB.getStatuses() || [];
      renderStatuses();
      renderFeed();
    });

    setInterval(() => {
      const newPosts = DB.getPosts() || [];
      const newStatuses = DB.getStatuses() || [];
      if (newPosts.length !== posts.length || newStatuses.length !== statuses.length) {
        posts = newPosts; statuses = newStatuses;
        renderStatuses(); renderFeed();
      }
    }, 1500);

    renderAll();

    document.getElementById('addStatusBtn').addEventListener('click', ()=> location.href='status.html');
    document.getElementById('createPostBtn').addEventListener('click', ()=> location.href='create_post.html');
    document.getElementById('loadMore').addEventListener('click', ()=> { page++; renderFeed(); });

  })();
  </script>
</body>
</html>
