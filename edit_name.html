<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Editar Nome</title>
  <link rel="stylesheet" href="base.css" />
  <style>
    :root{--accent:#ff6b6b;--card:#fff;--muted:#6b7280}
    body{font-family:Inter,system-ui,Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#fff8f8,#fff1f1);margin:0;color:#071133}
    header{background:var(--card);box-shadow:0 6px 24px rgba(255,107,107,0.06);position:sticky;top:0;padding:12px}
    .container{max-width:720px;margin:18px auto;padding:12px}
    .card{background:var(--card);padding:16px;border-radius:12px;box-shadow:0 12px 30px rgba(255,107,107,0.06)}
    .field{display:flex;flex-direction:column;margin-bottom:12px}
    input{padding:10px;border-radius:8px;border:1px solid #e6eef6}
    .actions{display:flex;gap:8px}
    .btn.primary{background:var(--accent);color:#fff;padding:10px 14px;border-radius:10px;border:none}
    .muted{color:var(--muted)}
  </style>
</head>
<body>
  <script src="storage.js"></script>

  <header><div style="display:flex;align-items:center;justify-content:space-between"><a href="#" onclick="history.back();return false">Voltar</a><strong>Editar Nome</strong><div></div></div></header>

  <main class="container">
    <section class="card">
      <div id="info"></div>

      <div class="field">
        <label>Nome</label>
        <input id="firstName" placeholder="Nome">
      </div>

      <div class="field">
        <label>Apelido</label>
        <input id="lastName" placeholder="Apelido">
      </div>

      <div class="muted" id="cooldownInfo" style="margin-bottom:8px"></div>

      <div class="actions">
        <button id="save" class="btn primary">Guardar</button>
        <button id="cancel" class="btn ghost">Cancelar</button>
      </div>

      <div id="msg" style="margin-top:12px;color:#b91c1c"></div>
    </section>
  </main>

  <script>
  (function(){
    function qs(n){ return new URLSearchParams(location.search).get(n); }
    function fmtRemaining(ms){
      const s = Math.floor(ms/1000);
      const h = Math.floor(s/3600);
      const m = Math.floor((s%3600)/60);
      return `${h}h ${m}m`;
    }

    if (!window.DB) { alert('DB não carregado'); }

    const email = qs('user') || DB.getSession();
    if (!email) { alert('Utilizador não especificado'); location.href='feed.html'; }

    const users = DB.getUsers();
    const idx = users.findIndex(u => (u.email||'').toLowerCase() === (email||'').toLowerCase());
    if (idx === -1) { alert('Utilizador não encontrado'); location.href='feed.html'; }
    const user = users[idx];

    document.getElementById('info').innerHTML = `<div><strong>${user.name}</strong> — ${user.email}</div>`;
    const parts = (user.name||'').split(' ');
    document.getElementById('firstName').value = parts[0] || '';
    document.getElementById('lastName').value = parts.slice(1).join(' ') || '';

    const cooldownEl = document.getElementById('cooldownInfo');
    const msgEl = document.getElementById('msg');

    function checkCooldown(){
      const lastChange = user.lastNameChange ? new Date(user.lastNameChange) : null;
      if (!lastChange) { cooldownEl.textContent = 'Podes alterar o nome agora.'; return true; }
      const now = new Date();
      const diff = now - lastChange;
      const twelve = 12 * 60 * 60 * 1000;
      if (diff >= twelve) { cooldownEl.textContent = 'Podes alterar o nome agora.'; return true; }
      const remaining = twelve - diff;
      cooldownEl.textContent = `Podes alterar o nome novamente em ${fmtRemaining(remaining)}.`;
      return false;
    }

    checkCooldown();

    document.getElementById('save').addEventListener('click', ()=> {
      msgEl.textContent = '';
      if (!checkCooldown()) { msgEl.textContent = 'Ainda estás em cooldown para mudar o nome.'; return; }
      const fn = (document.getElementById('firstName').value || '').trim();
      const ln = (document.getElementById('lastName').value || '').trim();
      if (!fn) { msgEl.textContent = 'Nome não pode ficar vazio.'; return; }
      const newName = ln ? `${fn} ${ln}` : fn;

      // update user name
      users[idx].name = newName;
      users[idx].lastNameChange = new Date().toISOString();
      DB.saveUsers(users);

      // update all posts authored by this user to reflect new name
      const posts = DB.getPosts() || [];
      let changed = false;
      for (let i=0;i<posts.length;i++){
        if ((posts[i].authorEmail||'').toLowerCase() === (user.email||'').toLowerCase()){
          posts[i].name = newName;
          changed = true;
        }
      }
      if (changed) DB.savePosts(posts);

      alert('Nome alterado com sucesso. Próxima alteração disponível em 12 horas.');
      location.href = `profile.html?user=${encodeURIComponent(user.email)}`;
    });

    document.getElementById('cancel').addEventListener('click', ()=> history.back());
  })();
  </script>
</body>
</html>
